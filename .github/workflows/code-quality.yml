name: Code Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Check code formatting (Spotless)
      run: |
        cd azure-java-platform/azure-java-platform
        mvn spotless:check
        cd ../../farm-workers-api/farm-workers-api
        mvn spotless:check

    - name: Run SonarQube analysis
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        cd azure-java-platform/azure-java-platform
        mvn clean verify sonar:sonar \
          -Dsonar.projectKey=spring-boot-repo \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=$SONAR_TOKEN

    - name: Check dependency licenses
      run: |
        cd azure-java-platform/azure-java-platform
        mvn license:check

    - name: Generate dependency report
      run: |
        cd azure-java-platform/azure-java-platform
        mvn dependency:report
        cd ../../farm-workers-api/farm-workers-api
        mvn dependency:report

    - name: Comment PR with quality results
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '## Code Quality Analysis\n✅ Formatting checks passed\n✅ Dependency licenses verified\n📊 View detailed analysis in SonarCloud'
          });

