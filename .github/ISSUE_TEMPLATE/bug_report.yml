name: Bug Report
description: Report a bug to help us improve
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out this form as completely as possible.

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Prerequisites
      description: Please verify you've completed the following
      options:
        - label: I've checked existing issues (open and closed)
          required: true
        - label: I'm using the latest version
          required: true
        - label: I've followed the Contributing guidelines
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Clear and concise description of the bug
      placeholder: What went wrong?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the issue
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen
      placeholder: Expected behavior here
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Actual behavior here
    validations:
      required: true

  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Which project is affected?
      options:
        - azure-java-platform
        - farm-workers-api
        - spring-academy-intro
        - Multiple projects
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your development environment
      placeholder: |
        - Java Version: 21
        - OS: Windows 11 / Ubuntu 22.04
        - IDE: IntelliJ IDEA / VS Code
        - Spring Boot Version: 3.3.4
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Messages
      description: Relevant error logs or stack traces
      render: logs
      placeholder: Paste error message or log output here

  - type: textarea
    id: workaround
    attributes:
      label: Workaround (if applicable)
      description: Any temporary workaround for this issue
      placeholder: Does this have a workaround? If so, describe it here.

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other relevant information
      placeholder: Screenshots, links to related issues, etc.

