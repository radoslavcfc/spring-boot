# ╔══════════════════════════════════════════════════════════╗
# ║  Local Development Stack                                 ║
# ║  ≈ docker-compose.yml in a .NET project                 ║
# ║                                                          ║
# ║  Run: docker-compose up -d                              ║
# ║  Then: mvn spring-boot:run -Dspring.profiles.active=dev ║
# ╚══════════════════════════════════════════════════════════╝
version: '3.8'

services:

  # ─── Azure CosmosDB Emulator ─────────────────────────────
  # ≈ In .NET you'd also use this or the CosmosDB emulator app
  cosmosdb-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: cosmosdb-emulator
    ports:
      - "8081:8081"     # Data Explorer + API
      - "10251-10254:10251-10254"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: 10
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    volumes:
      - cosmosdb-data:/tmp/cosmos/appdata
    healthcheck:
      test: ["CMD", "curl", "-f", "-k", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ─── Azurite (Azure Storage Emulator) ────────────────────
  # Emulates: Blob Storage, Queue Storage, Table Storage
  # ≈ Azurite in .NET projects
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: azurite
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue  ← we use this
      - "10002:10002"   # Table
    command: "azurite --silent --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    volumes:
      - azurite-data:/data

  # ─── Azure Service Bus Emulator ──────────────────────────
  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: servicebus-emulator
    ports:
      - "5672:5672"   # AMQP
      - "5300:5300"   # Management
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - ./servicebus-config.json:/ServiceBus_Emulator/ConfigFiles/Config.json

  # ─── Azure Functions Runtime (local) ─────────────────────
  # Your Azure Functions project would run here
  # Run separately: cd azure-functions && func start
  # Image shown for reference if containerizing functions:
  # azure-functions:
  #   build: ./azure-functions
  #   ports:
  #     - "7071:7071"

  # ─── Prometheus + Grafana for metrics (optional) ─────────
  # ≈ Application Insights in Azure / Seq for local .NET
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring  # Only starts with: docker-compose --profile monitoring up

volumes:
  cosmosdb-data:
  azurite-data:
