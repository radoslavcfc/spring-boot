# ╔══════════════════════════════════════════════════════════╗
# ║  .NET → Java: Configuration Files                        ║
# ║  appsettings.json / appsettings.Development.json         ║
# ║    →  application.properties / application-dev.properties║
# ║  IConfiguration["Section:Key"]                           ║
# ║    →  @Value("${section.key}") in Java                  ║
# ║  IOptions<MyOptions>                                     ║
# ║    →  @ConfigurationProperties(prefix="my")             ║
# ╚══════════════════════════════════════════════════════════╝

# ─────────────────────────────────────────────────────────────
# SERVER
# ─────────────────────────────────────────────────────────────
server.port=8080
# Context path  ≈  app.UsePathBase("/api") in .NET
# server.servlet.context-path=/

# ─────────────────────────────────────────────────────────────
# APPLICATION INFO
# ─────────────────────────────────────────────────────────────
spring.application.name=farm-workers-api

# ─────────────────────────────────────────────────────────────
# AZURE ENTRA ID (formerly Azure AD)  ─  Authentication
# ≈ AzureAd section in appsettings.json
# ─────────────────────────────────────────────────────────────
# Your Azure tenant (directory) ID
azure.ad.tenant-id=${AZURE_TENANT_ID}
# Your registered app (client) ID in Entra ID
azure.ad.client-id=${AZURE_CLIENT_ID}
# Client secret (use Key Vault in production, env var in dev)
azure.ad.client-secret=${AZURE_CLIENT_SECRET}

# Spring Security OAuth2 Resource Server - JWT validation
# This URL points to Azure's public key endpoint for your tenant
# Azure will automatically provide the jwks_uri at the issuer-uri
spring.security.oauth2.resourceserver.jwt.issuer-uri=\
  https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
  https://login.microsoftonline.com/${AZURE_TENANT_ID}/discovery/v2.0/keys

# ─────────────────────────────────────────────────────────────
# AZURE COSMOS DB (NoSQL)
# ≈ ConnectionStrings section + CosmosDb options in appsettings.json
# ─────────────────────────────────────────────────────────────
spring.cloud.azure.cosmos.endpoint=${COSMOS_ENDPOINT}
spring.cloud.azure.cosmos.key=${COSMOS_KEY}
spring.cloud.azure.cosmos.database=${COSMOS_DATABASE:farm-workers-db}
# Populate the containers with demo data on startup (dev only)
spring.cloud.azure.cosmos.populate-query-metrics=true

# ─────────────────────────────────────────────────────────────
# AZURE SERVICE BUS
# ─────────────────────────────────────────────────────────────
azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING}
azure.servicebus.worker-events-queue=worker-events
azure.servicebus.payroll-topic=payroll-events

# ─────────────────────────────────────────────────────────────
# AZURE STORAGE QUEUES
# ─────────────────────────────────────────────────────────────
azure.storage.connection-string=${STORAGE_CONNECTION_STRING}
azure.storage.queues.work-records-created=work-records-created
azure.storage.queues.notifications=worker-notifications

# ─────────────────────────────────────────────────────────────
# AZURE FUNCTIONS (HTTP triggers)
# ─────────────────────────────────────────────────────────────
azure.functions.base-url=${FUNCTIONS_BASE_URL}
azure.functions.api-key=${FUNCTIONS_API_KEY}

# ─────────────────────────────────────────────────────────────
# LOGGING
# ≈ Serilog / NLog configuration in .NET
# ─────────────────────────────────────────────────────────────
# Root log level  ≈  "Default": "Information" in appsettings
logging.level.root=INFO
# Our app's packages - more verbose for debugging
logging.level.com.farm.workers=DEBUG
# Show SQL/CosmosDB queries in development
logging.level.com.azure.spring.data.cosmos=DEBUG
# Spring Security - useful for auth debugging
logging.level.org.springframework.security=DEBUG

# Log format with timestamp, level, thread, logger name, message
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ─────────────────────────────────────────────────────────────
# ACTUATOR (Health checks, metrics)
# ≈ ASP.NET Core Health Checks + /metrics endpoint
# ─────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,env
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# App info shown at /actuator/info
info.app.name=Farm Workers API
info.app.version=1.0.0
info.app.description=Seasonal farm worker management

# ─────────────────────────────────────────────────────────────
# SWAGGER / OPENAPI
# ≈ Swashbuckle configuration
# ─────────────────────────────────────────────────────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Try-it-out enabled by default
springdoc.swagger-ui.try-it-out-enabled=true

# ─────────────────────────────────────────────────────────────
# JACKSON (JSON serialization)
# ≈ JsonSerializerOptions in System.Text.Json
# ─────────────────────────────────────────────────────────────
# Use camelCase for JSON output  ≈  JsonNamingPolicy.CamelCase
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
# Don't serialize null fields  ≈  DefaultIgnoreCondition = WhenWritingNull
spring.jackson.default-property-inclusion=NON_NULL
# Serialize Java 8 dates as ISO strings  ≈  default in .NET System.Text.Json
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
