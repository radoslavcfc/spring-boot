# ╔══════════════════════════════════════════════════════════╗
# ║  Development profile configuration                       ║
# ║  ≈ appsettings.Development.json in .NET                 ║
# ║                                                          ║
# ║  Activate with:                                          ║
# ║  SPRING_PROFILES_ACTIVE=dev                             ║
# ║  ≈ ASPNETCORE_ENVIRONMENT=Development                   ║
# ╚══════════════════════════════════════════════════════════╝

# ─── LOCAL AZURE EMULATORS ───────────────────────────────────
# Use Cosmos DB Emulator for local development
# Download: https://aka.ms/cosmosdb-emulator
spring.cloud.azure.cosmos.endpoint=https://localhost:8081
spring.cloud.azure.cosmos.key=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
spring.cloud.azure.cosmos.database=farm-workers-db
# Emulator uses self-signed cert - allow in dev only
spring.cloud.azure.cosmos.gateway-mode-max-connection-pool-size=1000

# Use Azurite for local Storage Queue emulation
# Run: npx azurite --silent --location /tmp/azurite
azure.storage.connection-string=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OGLjX+N7GWY=;QueueEndpoint=http://127.0.0.1:10001/devstoreaccount1;

# Use Service Bus emulator (or disable for dev)
# Alternative: use actual Service Bus with a dev namespace
azure.servicebus.connection-string=${SERVICEBUS_CONNECTION_STRING:Endpoint=sb://localhost/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=local-key}

# Mock Azure Functions URL for local testing
azure.functions.base-url=http://localhost:7071
azure.functions.api-key=dev-local-key

# Azure AD - use your actual dev tenant (or mock with a local OIDC server)
# For local testing without Azure: use the mock profile instead
azure.ad.tenant-id=${AZURE_TENANT_ID:your-dev-tenant-id}
azure.ad.client-id=${AZURE_CLIENT_ID:your-dev-client-id}
azure.ad.client-secret=${AZURE_CLIENT_SECRET:your-dev-secret}

spring.security.oauth2.resourceserver.jwt.issuer-uri=\
  https://login.microsoftonline.com/${azure.ad.tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=\
  https://login.microsoftonline.com/${azure.ad.tenant-id}/discovery/v2.0/keys

# ─── VERBOSE LOGGING IN DEV ──────────────────────────────────
logging.level.root=DEBUG
logging.level.com.farm.workers=TRACE
logging.level.org.springframework.web=DEBUG

# ─── ACTUATOR ─ expose everything in dev ─────────────────────
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
